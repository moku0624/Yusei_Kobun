<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>高校受験 中学古文単語マスター Phase 1 (必出60語)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e74c3c;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 24px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.4rem;
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        select, button {
            padding: 10px 14px;
            font-size: 0.95rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .progress-bar {
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background-color: #2ecc71;
            width: 0%;
            transition: width 0.3s ease;
        }

        .card {
            background: #fdfdfd;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .level-badge {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .underlined {
            text-decoration: underline;
            text-decoration-color: var(--secondary-color);
            text-decoration-thickness: 3px;
            font-weight: bold;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option-btn {
            text-align: left;
            background: white;
            color: var(--text-color);
            border: 2px solid #e2e8f0;
            padding: 12px 16px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: var(--accent-color);
            background: #f0f8ff;
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            background-color: #eef6fc;
            border-left: 4px solid var(--accent-color);
            border-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.6;
            display: none;
        }

        #quizArea {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">

            <button id="startBtn">学習を開始</button>
        </div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="quizArea">
        <div class="card">
            <span class="level-badge" id="levelBadge"></span>
            <div class="question-text" id="questionText"></div>
            <div class="options-grid" id="optionsGrid"></div>
            <div class="explanation" id="explanationBox"></div>
            <button id="nextBtn" style="display:none; width:100%; margin-top:10px;">次の問題へ</button>
        </div>
    </div>

    id: 57, word: "いとど", mean: "ますます・いっそう",
    example: "雨降りて、いとど寒し。", target: "いとど",
    contextMean: "ますます", translate: "雨が降って、ますます寒い。",
    fillSentence: "雨が降って、【空欄】寒い。", fillAnswer: "ますます",
    distractorsL1: ["少しだけ", "突然", "たまたま"],
    distractorsL2: ["少しだけ", "急に", "たまたま"],
    distractorsL3: ["少しだけ", "急に", "たまたま"],
    exp: "前より程度が増すことを表す。「ますます・いっそう」。"
  },
  {
    id: 58, word: "おのづから", mean: "自然に・偶然に",
    example: "時たてば、おのづから分かる。", target: "おのづから",
    contextMean: "自然に", translate: "時がたてば、自然に分かる。",
    fillSentence: "時がたてば、【空欄】分かる。", fillAnswer: "自然に",
    distractorsL1: ["わざと", "無理に", "急いで"],
    distractorsL2: ["わざと", "無理に", "急いで"],
    distractorsL3: ["わざと", "無理に", "急いで"],
    exp: "人為によらず「自然に」、また「偶然に」の意味。"
  },
  {
    id: 59, word: "けち", mean: "不吉な兆し・異変",
    example: "空にけち現れたり。", target: "けち",
    contextMean: "不吉な兆し", translate: "空に不吉な兆しが現れた。",
    fillSentence: "空に【空欄】が現れた。", fillAnswer: "不吉な兆し",
    distractorsL1: ["祝い事", "宝物", "命令"],
    distractorsL2: ["値引き", "祝い事", "美しい景色"],
    distractorsL3: ["値引き", "祝い事", "美しい景色"],
    exp: "現代語の「けち」と違い、怪しい出来事・不吉な兆しを表す。"
  },
  {
    id: 60, word: "そこ", mean: "あなた・そなた",
    example: "そこは、いづち行く。", target: "そこ",
    contextMean: "あなた", translate: "あなたは、どこへ行くのか。",
    fillSentence: "【空欄】は、どこへ行くのか。", fillAnswer: "あなた",
    distractorsL1: ["わたし", "あの人", "この場所"],
    distractorsL2: ["その場所", "あの人", "わたし"],
    distractorsL3: ["その場所", "あの人", "わたし"],
    exp: "二人称代名詞として「あなた・そなた」。場所を表す現代語の「そこ」と区別する。"
  }
];


let currentLevel = 1;
let currentQuestionIndex = 0;
let score = 0;
let shuffledWords = [];

const levelSelect = document.getElementById('levelSelect');
const startBtn = document.getElementById('startBtn');
const quizArea = document.getElementById('quizArea');
const questionText = document.getElementById('questionText');
const optionsGrid = document.getElementById('optionsGrid');
const explanationBox = document.getElementById('explanationBox');
const nextBtn = document.getElementById('nextBtn');
const progressFill = document.getElementById('progressFill');
const levelBadge = document.getElementById('levelBadge');

function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}


function validateQuestionData() {
    const errors = [];
    wordsData.forEach(q => {
        if (!q.example.includes(q.target)) {
            errors.push(`ID ${q.id}: example に target「${q.target}」がありません`);
        }
        if (!q.fillSentence.includes("【空欄】")) {
            errors.push(`ID ${q.id}: fillSentence に【空欄】がありません`);
        }

        [
            ["Lv.1", q.mean, q.distractorsL1],
            ["Lv.2", q.contextMean, q.distractorsL2],
            ["Lv.3", q.fillAnswer, q.distractorsL3]
        ].forEach(([level, correct, ds]) => {
            if (!Array.isArray(ds) || ds.length !== 3) {
                errors.push(`ID ${q.id} ${level}: 誤答選択肢が3つではありません`);
                return;
            }
            const normalized = [correct, ...ds].map(v =>
                String(v).replace(/[・、。,\s]/g, "")
            );
            if (new Set(normalized).size !== 4) {
                errors.push(`ID ${q.id} ${level}: 重複またはほぼ同一表記の選択肢があります`);
            }
        });
    });

    if (errors.length) {
        console.error("問題データ検証エラー:", errors);
    } else {
        console.info(`問題データ検証OK: ${wordsData.length}語 × 3レベル`);
    }
}

validateQuestionData();

startBtn.addEventListener('click', () => {
    currentLevel = parseInt(levelSelect.value);
    shuffledWords = shuffleArray(wordsData);
    currentQuestionIndex = 0;
    score = 0;
    quizArea.style.display = 'block';
    renderQuestion();
});

function renderQuestion() {
    explanationBox.style.display = 'none';
    nextBtn.style.display = 'none';
    optionsGrid.innerHTML = '';

    const qData = shuffledWords[currentQuestionIndex];
    levelBadge.textContent = `Phase 1 - Lv.${currentLevel}`;

    const progress = (currentQuestionIndex / shuffledWords.length) * 100;
    progressFill.style.width = `${progress}%`;

    const correctAnswer =
        currentLevel === 1 ? qData.mean :
        currentLevel === 2 ? qData.contextMean :
        qData.fillAnswer;

    if (currentLevel === 1) {
        questionText.innerHTML =
            `「<span class="underlined">${qData.word}</span>」の基本の意味として最も適切なものを選びなさい。`;
    } else if (currentLevel === 2) {
        const highlightedExample = qData.example.replace(
            qData.target,
            `<span class="underlined">${qData.target}</span>`
        );
        questionText.innerHTML =
            `次の古文を読み、下線部の意味として最も適切なものを選びなさい。<br><br>${highlightedExample}`;
    } else {
        const fillHtml = qData.fillSentence.replace(
            "【空欄】",
            `<span class="underlined">【 空欄 】</span>`
        );
        questionText.innerHTML =
            `次の古文と現代語訳を対応させ、【空欄】に入る最も適切な言葉を選びなさい。` +
            `<br><br>【古文】${qData.example}` +
            `<br>【現代語訳】${fillHtml}`;
    }

    const distractors =
        currentLevel === 1 ? qData.distractorsL1 :
        currentLevel === 2 ? qData.distractorsL2 :
        qData.distractorsL3;

    const options = shuffleArray([correctAnswer, ...distractors]);

    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.addEventListener('click', () => checkAnswer(opt, correctAnswer, qData, btn));
        optionsGrid.appendChild(btn);
    });
}

function checkAnswer(selectedOpt, correctOpt, qData, clickedBtn) {
    const buttons = optionsGrid.querySelectorAll('.option-btn');
    buttons.forEach(btn => btn.disabled = true);

    if (selectedOpt === correctOpt) {
        clickedBtn.classList.add('correct');
        score++;
    } else {
        clickedBtn.classList.add('wrong');
        buttons.forEach(btn => {
            if (btn.textContent === correctOpt) {
                btn.classList.add('correct');
            }
        });
    }

    explanationBox.innerHTML = `
        <strong>【解説】</strong><br>
        <strong>基本の意味：</strong>${qData.mean}<br>
        <strong>この文での意味：</strong>${qData.contextMean}<br>
        <strong>例文：</strong>${qData.example}<br>
        <strong>現代語訳：</strong>${qData.translate}<br>
        <strong>ポイント：</strong>${qData.exp}
    `;
    explanationBox.style.display = 'block';
    nextBtn.style.display = 'block';
}

nextBtn.addEventListener('click', () => {
    currentQuestionIndex++;
    if (currentQuestionIndex < shuffledWords.length) {
        renderQuestion();
    } else {
        finishQuiz();
    }
});

function finishQuiz() {
    progressFill.style.width = '100%';
    questionText.innerHTML = `🎉 演習終了！`;
    optionsGrid.innerHTML = `
        <div style="text-align:center; padding:20px;">
            <p style="font-size:1.2rem;">Phase 1 (60語) の演習が完了しました。</p>
            <p style="font-size:1.5rem; font-weight:bold; color:var(--accent-color);">
                スコア: ${score} / ${shuffledWords.length} 問正解
            </p>
        </div>
    `;
    explanationBox.style.display = 'none';
    nextBtn.style.display = 'none';
}

</script>
